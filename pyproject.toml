[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "academia-orcid"
version = "0.1.0"
description = "ORCID publications and profile data as structured JSON for the faculty composer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "requests",
]

[project.optional-dependencies]
config = [
    "pyyaml>=6.0",
]

[dependency-groups]
# `uv run` installs these by default (just test / lint / typecheck).
dev = [
    "pytest",
    "pyyaml>=6.0",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
# `just typecheck`: the package and the entry points; the tests are left out
# (monkeypatched, untyped).
python_version = "3.10"
files = ["src", "run_json.py", "run_prefetch.py"]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
